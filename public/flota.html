<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flota — Traslados GC</title>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/estilos.css">
  <style>
    body { background: var(--gris-fondo); color: var(--texto-oscuro); min-height: 100vh; }
    header.app {
      background: var(--charcoal);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      border-bottom: 3px solid var(--terracota);
    }
    header.app .marca {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 28px;
      font-weight: 500;
      color: var(--texto-claro);
      letter-spacing: 2px;
      text-decoration: none;
      text-align: center;
      justify-self: center;
    }
    header.app a.nav { color: rgba(255,255,255,0.65); text-decoration: none; font-size: 14px; }
    header.app a.nav:hover { color: #fff; }
    header.app a.nav.izquierda { justify-self: start; }
    header.app a.nav.derecha { justify-self: end; }
    @media (max-width: 560px) {
      header.app { padding: 12px 14px; }
      header.app .marca { font-size: 19px; letter-spacing: 1px; }
      header.app a.nav { font-size: 12px; }
    }
    .contenido { max-width: 700px; margin: 0 auto; padding: 40px 24px 80px; text-align: center; }
    h1 { font-family: 'Big Shoulders Display', sans-serif; font-size: clamp(32px, 6vw, 52px); margin-bottom: 12px; color: var(--texto-oscuro); }
    .subtitulo { color: var(--texto-muted); font-size: 19px; font-style: italic; letter-spacing: 0.3px; margin-bottom: 48px; line-height: 1.6; }
    .aviso { color: var(--texto-muted); font-size: 14px; }
    @media (max-width: 600px) { .contenido { padding: 24px 16px 60px; } }
    footer { text-align: center; padding: 30px; color: var(--texto-muted); font-size: 13px; }
  </style>
</head>
<body>
  <header class="app">
    <a id="link-inicio-header" href="/" class="nav izquierda">Inicio</a>
    <a id="link-logo-header" href="/" class="marca">TRASLADOS · GC</a>
    <a id="link-contacto-header" href="/contacto" class="nav derecha">Contacto</a>
  </header>
  <div class="contenido">
    <h1>Flota</h1>
    <p class="subtitulo">Conoce los vehículos que te llevarán a tu destino</p>
    <p class="aviso">Estamos preparando esta sección. Muy pronto podrás ver aquí toda nuestra flota.</p>
  </div>
  <footer>
    <div style="margin-bottom:12px;">
      <a id="footer-rutas" href="/rutas" style="color:var(--texto-muted);text-decoration:none;margin:0 12px;font-size:13px;">Rutas</a>
      <a id="footer-destinos" href="/destinos" style="color:var(--texto-muted);text-decoration:none;margin:0 12px;font-size:13px;">Destinos</a>
      <a id="footer-flota" href="/flota" style="color:var(--texto-muted);text-decoration:none;margin:0 12px;font-size:13px;">Flota</a>
      <a id="footer-contacto" href="/contacto" style="color:var(--texto-muted);text-decoration:none;margin:0 12px;font-size:13px;">Contacto</a>
      <a id="footer-alta-choferes" href="/chofer/acceso/alta" style="color:var(--texto-muted);text-decoration:none;margin:0 12px;font-size:13px;">Alta choferes</a>
      <a id="footer-acceso-choferes" href="/chofer/acceso" style="color:var(--texto-muted);text-decoration:none;margin:0 12px;font-size:13px;">Acceso a choferes</a>
      <a id="footer-acceso-clientes" href="/mi-reserva" style="color:var(--texto-muted);text-decoration:none;margin:0 12px;font-size:13px;">Acceso clientes</a>
    </div>
    Traslados · GC — Gran Canaria
  </footer>
<script>
    // Traducir footer al idioma de la URL
    (function() {
      var partes = window.location.pathname.split('/');
      var lang = (partes[1] && partes[1].length === 2) ? partes[1] : 'es';
      fetch('/api/palabras-paginas-publico?lang=' + lang)
        .then(function(r) { return r.json(); })
        .then(function(pp) {
          if (lang !== 'es') {
            var base = '/' + lang + '/';
            document.getElementById('link-inicio-header').href   = '/' + lang + '/';
            document.getElementById('link-logo-header').href     = '/' + lang + '/';
            document.getElementById('link-contacto-header').href = base + (pp.contacto || 'contacto');
            document.getElementById('footer-rutas').href          = base + (pp.rutas    || 'rutas');
            document.getElementById('footer-destinos').href       = base + (pp.destinos || 'destinos');
            document.getElementById('footer-flota').href          = base + (pp.flota    || 'flota');
            document.getElementById('footer-contacto').href       = base + (pp.contacto || 'contacto');
            document.getElementById('footer-acceso-clientes').href = base + (pp.palabra_mi_reserva || 'mi-reserva');
          }
          if (pp.footer_rutas)           document.getElementById('footer-rutas').textContent           = pp.footer_rutas;
          if (pp.footer_destinos)        document.getElementById('footer-destinos').textContent        = pp.footer_destinos;
          if (pp.footer_flota)           document.getElementById('footer-flota').textContent           = pp.footer_flota;
          if (pp.footer_contacto)        document.getElementById('footer-contacto').textContent        = pp.footer_contacto;
          if (pp.footer_alta_choferes)   document.getElementById('footer-alta-choferes').textContent   = pp.footer_alta_choferes;
          if (pp.footer_acceso_choferes) document.getElementById('footer-acceso-choferes').textContent = pp.footer_acceso_choferes;
          if (pp.footer_acceso_clientes) document.getElementById('footer-acceso-clientes').textContent = pp.footer_acceso_clientes;
          if (pp.nav_inicio)   document.getElementById('link-inicio-header').textContent   = pp.nav_inicio;
          if (pp.nav_contacto) document.getElementById('link-contacto-header').textContent = pp.nav_contacto;
        }).catch(function() {});
    })();
  </script>
</body>
</html>
