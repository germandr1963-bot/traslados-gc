<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Destino — Traslados GC</title>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/estilos.css">
  <style>
    body { background: var(--gris-fondo); color: var(--texto-oscuro); min-height: 100vh; }

    header.app {
      background: var(--charcoal);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      border-bottom: 3px solid var(--terracota);
    }
    header.app .marca {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 28px;
      font-weight: 500;
      color: var(--texto-claro);
      letter-spacing: 2px;
      text-decoration: none;
      text-align: center;
      justify-self: center;
    }
    header.app a.nav { color: rgba(255,255,255,0.65); text-decoration: none; font-size: 14px; }
    header.app a.nav:hover { color: #fff; }
    header.app a.nav.izquierda { justify-self: start; }
    header.app a.nav.derecha { justify-self: end; }
    @media (max-width: 560px) {
      header.app { padding: 12px 14px; }
      header.app .marca { font-size: 19px; letter-spacing: 1px; }
      header.app a.nav { font-size: 12px; }
    }

    .breadcrumbs { font-size: 13px; color: var(--texto-muted); margin-bottom: 18px; }
    .breadcrumbs a { color: var(--texto-muted); text-decoration: none; }
    .breadcrumbs a:hover { text-decoration: underline; }
    .contenido { max-width: 860px; margin: 0 auto; padding: 40px 24px 80px; }

    /* Imagen cabecera */
    .foto-cabecera {
      width: 100%;
      height: 400px;
      background: var(--charcoal);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 32px;
    }
    .foto-cabecera img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Título */
    h1 {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: clamp(32px, 6vw, 52px);
      margin-bottom: 24px;
      line-height: 1.1;
      text-align: center;
    }

    /* Texto descriptivo */
    .texto-destino {
      font-size: 15px;
      line-height: 1.75;
      color: var(--texto-oscuro);
      margin-bottom: 48px;
    }
    .texto-destino h2 { font-family: 'Big Shoulders Display', sans-serif; font-size: 24px; margin: 28px 0 10px; }
    .texto-destino h2:first-of-type { font-size: 32px; text-align: center; color: #b02020; margin-bottom: 18px; }
    .texto-destino h3 { font-family: 'Big Shoulders Display', sans-serif; font-size: 20px; margin: 22px 0 8px; }
    .texto-destino p  { margin: 0 0 14px; }
    .texto-destino ul { padding-left: 20px; margin: 0 0 14px; }
    .texto-destino li { margin-bottom: 6px; }

    /* Tres fotos */
    .fotos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 48px;
    }
    .foto-item {
      height: 220px;
      background: var(--charcoal);
      border-radius: 10px;
      overflow: hidden;
    }
    .foto-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* CTA reserva */
    .cta-destino {
      text-align: center;
      margin: 0 0 48px;
    }
    .cta-destino-btn {
      display: inline-block;
      background: var(--terracota);
      color: #fff;
      text-decoration: none;
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
      padding: 16px 40px;
      border-radius: 8px;
      transition: opacity 0.2s;
    }
    .cta-destino-btn:hover { opacity: 0.88; }

    .cargando { text-align: center; color: var(--texto-muted); font-size: 14px; padding: 80px 0; }
    .error-msg { text-align: center; color: var(--texto-muted); font-size: 14px; padding: 80px 0; }

    footer { text-align: center; padding: 30px; color: var(--texto-muted); font-size: 13px; }
    footer a { color: var(--texto-muted); text-decoration: none; margin: 0 12px; font-size: 13px; }
    footer a:hover { color: var(--texto-oscuro); }
    .footer-links { margin-bottom: 12px; }

    @media (max-width: 600px) {
      .contenido { padding: 24px 16px 60px; }
      .foto-cabecera { height: 220px; border-radius: 8px; }
      .fotos-grid { grid-template-columns: 1fr; }
      .foto-item { height: 200px; }
    }
  </style>
</head>
<body>
  <header class="app">
    <a id="link-volver-destinos" href="/destinos" class="nav izquierda">← Destinos</a>
    <a id="link-logo-header" href="/" class="marca">TRASLADOS · GC</a>
    <a id="link-contacto-header" href="/contacto" class="nav derecha">Contacto</a>
  </header>

  <div class="contenido">
    <div id="contenido-destino">
      <div class="cargando">⏳ Cargando...</div>
    </div>
  </div>

  <footer>
    <div class="footer-links">
      <a id="footer-rutas" href="/rutas">Rutas</a>
      <a id="footer-destinos" href="/destinos">Destinos</a>
      <a id="footer-flota" href="/flota">Flota</a>
      <a id="footer-contacto" href="/contacto">Contacto</a>
      <a id="footer-alta-choferes" href="/chofer/acceso/alta">Alta choferes</a>
      <a id="footer-acceso-choferes" href="/chofer/acceso">Acceso a choferes</a>
      <a id="footer-acceso-clientes" href="/mi-reserva">Acceso clientes</a>
    </div>
    Traslados · GC — Gran Canaria
  </footer>

  <script>
    var partes = window.location.pathname.split('/');
    // URL: /es/destino/gran-canaria/maspalomas
    //       [0] [1] [2]       [3]       [4]
    var lang = partes[1] || 'es';  // idioma de la URL
    var isla = partes[3] || '';
    var slug = partes[4] || '';

    Promise.all([
      fetch('/api/palabras-paginas-publico?lang=' + lang).then(function(r) { return r.json(); }),
      fetch('/api/destino-publico/' + isla + '/' + slug + '?lang=' + lang).then(function(r) { return r.json(); })
    ]).then(function(resultados) {
      var pp = resultados[0];
      var d  = resultados[1];

      // Cabecera y footer
      if (lang !== 'es') {
        var base = '/' + lang + '/';
        document.getElementById('link-logo-header').href      = '/' + lang + '/';
        document.getElementById('link-volver-destinos').href  = base + (pp.destinos || 'destinos');
        document.getElementById('link-contacto-header').href  = base + (pp.contacto || 'contacto');
        document.getElementById('footer-rutas').href          = base + (pp.rutas    || 'rutas');
        document.getElementById('footer-destinos').href       = base + (pp.destinos || 'destinos');
        document.getElementById('footer-flota').href          = base + (pp.flota    || 'flota');
        document.getElementById('footer-contacto').href       = base + (pp.contacto || 'contacto');
        document.getElementById('footer-acceso-clientes').href = base + (pp.palabra_mi_reserva || 'mi-reserva');
        document.getElementById('footer-alta-choferes').style.display   = 'none';
        document.getElementById('footer-acceso-choferes').style.display = 'none';
      }
      if (pp.footer_rutas)           document.getElementById('footer-rutas').textContent           = pp.footer_rutas;
      if (pp.footer_destinos)        document.getElementById('footer-destinos').textContent        = pp.footer_destinos;
      if (pp.footer_flota)           document.getElementById('footer-flota').textContent           = pp.footer_flota;
      if (pp.footer_contacto)        document.getElementById('footer-contacto').textContent        = pp.footer_contacto;
      if (pp.footer_alta_choferes)   document.getElementById('footer-alta-choferes').textContent   = pp.footer_alta_choferes;
      if (pp.footer_acceso_choferes) document.getElementById('footer-acceso-choferes').textContent = pp.footer_acceso_choferes;
      if (pp.footer_acceso_clientes) document.getElementById('footer-acceso-clientes').textContent = pp.footer_acceso_clientes;
      if (pp.nav_destinos_flecha)    document.getElementById('link-volver-destinos').textContent   = pp.nav_destinos_flecha;
      if (pp.nav_contacto)           document.getElementById('link-contacto-header').textContent   = pp.nav_contacto;

      // Contenido del destino
      if (!d || d.error) {
        document.getElementById('contenido-destino').innerHTML =
          '<div class="error-msg">Destino no encontrado.</div>';
        return;
      }

      document.getElementById('page-title').textContent = d.nombre + ' — Traslados GC';

      var html = '';

      // Breadcrumb
      var urlDestinos = lang !== 'es' ? '/' + lang + '/' + (pp.destinos || 'destinos') : '/destinos';
      html += '<nav class="breadcrumbs">';
      html += '<a href="' + (lang !== 'es' ? '/' + lang + '/' : '/') + '">' + (pp.nav_inicio || 'Inicio') + '</a>';
      html += '<span> › </span>';
      html += '<a href="' + urlDestinos + '">' + (pp.footer_destinos || 'Destinos') + '</a>';
      html += '<span> › </span>';
      html += '<span>' + d.nombre + '</span>';
      html += '</nav>';

      // Foto cabecera
      html += '<div class="foto-cabecera">';
      if (d.foto_cabecera_id) {
        html += '<img src="/destino-foto/' + d.foto_cabecera_id + '" alt="' + d.nombre + '">';
      }
      html += '</div>';

      // Título
      html += '<h1>' + d.nombre + '</h1>';

      // Texto descriptivo
      if (d.texto_descripcion) {
        html += '<div class="texto-destino">' + d.texto_descripcion + '</div>';
      }

      // CTA — enlace al inicio con el destino preseleccionado en el buscador
      if (pp.destino_cta_texto) {
        var urlBase = lang !== 'es' ? '/' + lang + '/' : '/';
        var urlCta = urlBase + '?hasta=' + encodeURIComponent(d.nombre_es).replace(/%20/g, '+');
        html += '<div class="cta-destino">' +
          '<a href="' + urlCta + '" class="cta-destino-btn">' + pp.destino_cta_texto + ' ' + d.nombre + '</a>' +
          '</div>';
      }

      // Tres fotos
      if (d.fotos && d.fotos.length > 0) {
        html += '<div class="fotos-grid">';
        d.fotos.forEach(function(f) {
          html += '<div class="foto-item"><img src="/destino-foto/' + f.id + '" alt="' + (f.alt_texto || d.nombre) + '"></div>';
        });
        html += '</div>';
      }

      document.getElementById('contenido-destino').innerHTML = html;

    }).catch(function() {
      document.getElementById('contenido-destino').innerHTML =
        '<div class="error-msg">No se pudo cargar el destino.</div>';
    });
  </script>
</body>
</html>
