<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Traslados GC</title>
  <meta id="meta-description" name="description" content="">
  <meta id="meta-robots" name="robots" content="index,follow">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta id="og-site-name" property="og:site_name" content="Traslados GC">
  <meta id="og-title" property="og:title" content="">
  <meta id="og-description" property="og:description" content="">
  <meta id="og-url" property="og:url" content="">
  <meta id="og-image" property="og:image" content="">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter -->
  <meta id="tw-card" name="twitter:card" content="summary_large_image">
  <meta id="tw-title" name="twitter:title" content="">
  <meta id="tw-description" name="twitter:description" content="">
  <meta id="tw-image" name="twitter:image" content="">

  <!-- Canonical -->
  <link id="link-canonical" rel="canonical" href="">

  <!-- Hreflang: se inyectan desde JS -->

  <!-- Schema.org: se inyectan desde JS -->

  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/estilos.css">
  <style>
    body { background: var(--gris-fondo); color: var(--texto-oscuro); min-height: 100vh; }

    /* ── Cabecera — idéntica a traslado.html ── */
    header.app {
      background: var(--charcoal);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      border-bottom: 3px solid var(--terracota);
    }
    header.app .marca {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 28px;
      font-weight: 500;
      color: var(--texto-claro);
      letter-spacing: 2px;
      text-decoration: none;
      text-align: center;
      justify-self: center;
    }
    header.app a.nav { color: rgba(255,255,255,0.65); text-decoration: none; font-size: 14px; }
    header.app a.nav:hover { color: #fff; }
    header.app a.nav.izquierda { justify-self: start; }
    header.app .derecha-header { justify-self: end; }

    /* ── Contenido ── */
    .contenido { max-width: 860px; margin: 0 auto; padding: 40px 24px 80px; }

    /* ── Foto de cabecera ── */
    .foto-cabecera {
      width: 100%;
      height: 400px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .foto-cabecera img { width: 100%; height: 100%; object-fit: contain; display: block; }

    /* ── Título ── */
    h1.titulo-categoria {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: clamp(32px, 6vw, 52px);
      margin-bottom: 10px;
      line-height: 1.1;
      text-align: center;
    }

    /* ── Subtítulo ── */
    .subtitulo-categoria {
      font-size: 15px;
      color: var(--texto-muted);
      text-align: center;
      margin-bottom: 10px;
    }

    /* ── Descripción corta ── */
    .descripcion-categoria {
      font-size: 15px;
      font-style: italic;
      color: var(--texto-oscuro);
      text-align: center;
      margin-bottom: 24px;
    }

    /* ── Botones de acción ── */
    .botones-accion {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 36px;
    }
    .boton-reservar {
      display: inline-block;
      background: var(--terracota);
      color: white;
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
      padding: 16px 40px;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .boton-reservar:hover { opacity: 0.88; }

    /* ── Características ── */
    .caracteristicas-lista {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 36px;
    }
    .caracteristica-item {
      background: var(--gris-borde);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 13px;
      color: var(--texto-oscuro);
    }
    .caracteristica-item::before { content: '✓ '; color: var(--terracota); font-weight: 600; }

    /* ── Capacidad ── */
    .capacidad-bloque {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .capacidad-item {
      background: white;
      border: 1px solid var(--gris-borde);
      border-radius: 10px;
      padding: 12px 24px;
      text-align: center;
      min-width: 110px;
    }
    .capacidad-item .cap-valor {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 28px;
      color: var(--terracota);
      line-height: 1;
    }
    .capacidad-item .cap-etiqueta {
      font-size: 12px;
      color: var(--texto-muted);
      margin-top: 4px;
    }

    /* ── Descripción larga ── */
    .descripcion-larga {
      font-size: 15px;
      line-height: 1.75;
      color: var(--texto-oscuro);
      margin-bottom: 40px;
      white-space: pre-line;
    }

    /* ── Secciones ── */
    .seccion { margin: 40px 0; }
    .seccion > h2 {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 500;
      font-size: 24px;
      margin-bottom: 18px;
      color: var(--texto-oscuro);
    }

    /* ── Tabla de tarifas ── */
    .tabla-tarifas { width: 100%; border-collapse: collapse; font-size: 14px; }
    .tabla-tarifas th {
      background: var(--charcoal);
      color: var(--texto-claro);
      padding: 10px 14px;
      text-align: left;
      font-weight: 500;
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tabla-tarifas td { padding: 10px 14px; border-bottom: 1px solid var(--gris-borde); color: var(--texto-oscuro); }
    .tabla-tarifas th:last-child,
    .tabla-tarifas td:last-child { text-align: right; }
    .precio-valor { font-weight: 500; font-size: 16px; }
    .badge-fijo {
      background: var(--oro);
      color: var(--oro-texto);
      font-size: 11px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 10px;
      margin-left: 8px;
    }
    .consultar { color: var(--texto-muted); font-style: italic; }

    /* ── Cómo funciona — tres columnas ── */
    .tres-columnas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    /* ── Footer ── */
    footer { text-align: center; padding: 30px; color: var(--texto-muted); font-size: 13px; }
    footer a { color: var(--texto-muted); text-decoration: none; margin: 0 12px; font-size: 13px; }
    footer a:hover { color: var(--texto-oscuro); }
    .footer-links { margin-bottom: 12px; }

    /* ── Estado cargando / error ── */
    .cargando { text-align: center; color: var(--texto-muted); font-size: 14px; padding: 80px 0; }
    .error-msg { text-align: center; color: var(--texto-muted); font-size: 14px; padding: 80px 0; }

    /* ── Responsive móvil ── */
    @media (max-width: 560px) {
      header.app { padding: 12px 14px; }
      header.app .marca { font-size: 19px; letter-spacing: 1px; }
      header.app a.nav { font-size: 12px; }
      .contenido { padding: 24px 16px 60px; }
      .foto-cabecera { height: 220px; border-radius: 8px; }
      h1.titulo-categoria { font-size: clamp(24px, 7vw, 36px); }
      .boton-reservar { display: block; text-align: center; padding: 14px 20px; font-size: 17px; }
      .seccion { margin: 28px 0; }
      .tabla-tarifas { font-size: 13px; }
      .tabla-tarifas th, .tabla-tarifas td { padding: 8px 8px; }
      .tres-columnas { grid-template-columns: 1fr; gap: 12px; }
      .capacidad-bloque { gap: 10px; }
    }
  </style>
</head>
<body>

  <header class="app">
    <a id="link-volver-flota" href="/flota" class="nav izquierda">← Flota</a>
    <a id="link-logo" href="/" class="marca">TRASLADOS · GC</a>
    <div class="derecha-header">
      <a id="link-contacto" href="/contacto" class="nav">Contacto</a>
    </div>
  </header>

  <div class="contenido">
    <div id="contenido-categoria">
      <div class="cargando">⏳ Cargando...</div>
    </div>
  </div>

  <footer>
    <div class="footer-links">
      <a id="footer-rutas"             href="/rutas">Rutas</a>
      <a id="footer-destinos"          href="/destinos">Destinos</a>
      <a id="footer-flota"             href="/flota">Flota</a>
      <a id="footer-contacto"          href="/contacto">Contacto</a>
      <a id="footer-alta-choferes"     href="/chofer/acceso/alta">Alta choferes</a>
      <a id="footer-acceso-choferes"   href="/chofer/acceso">Acceso a choferes</a>
      <a id="footer-acceso-clientes"   href="/mi-reserva">Acceso clientes</a>
    </div>
    <span id="footer-marca">Traslados · GC</span> — Gran Canaria
  </footer>

  <script>
    // URL española:  /flota/:slug       → partes = ['','flota','slug']       lang='es'
    // URL otro idioma: /:lang/fleet/:slug → partes = ['','en','fleet','slug'] lang='en'
    var partes = window.location.pathname.split('/');
    var lang, slug;
    if (partes.length === 3) {
      // /flota/slug
      lang = 'es';
      slug = partes[2] || '';
    } else {
      // /:lang/palabra-flota/slug
      lang = partes[1] || 'es';
      slug = partes[3] || '';
    }

    fetch('/api/categoria-publica/' + lang + '/' + slug)
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (!d || d.error) {
          document.getElementById('contenido-categoria').innerHTML =
            '<div class="error-msg">Categoría no encontrada.</div>';
          return;
        }

        var cat = d.categoria;
        var pp  = d.palabrasPaginas;
        var tx  = d.textos;
        var base = lang !== 'es' ? '/' + lang + '/' : '/';

        // ── Meta tags y título ──────────────────────────────────────────────
        document.getElementById('page-title').textContent =
          cat.meta_title || (cat.nombre + ' — ' + d.nombreMarca);

        if (cat.meta_description) {
          document.getElementById('meta-description').setAttribute('content', cat.meta_description);
        }

        // Open Graph
        document.getElementById('og-site-name').setAttribute('content', d.nombreMarca);
        document.getElementById('og-title').setAttribute('content', cat.meta_title || cat.nombre);
        if (cat.meta_description) {
          document.getElementById('og-description').setAttribute('content', cat.meta_description);
        }
        if (cat.canonical_url) {
          document.getElementById('og-url').setAttribute('content', d.BASE_URL + cat.canonical_url);
          document.getElementById('link-canonical').setAttribute('href', d.BASE_URL + cat.canonical_url);
        }
        if (cat.tiene_foto) {
          document.getElementById('og-image').setAttribute('content', d.BASE_URL + '/admin/categorias/' + cat.id + '/foto');
          document.getElementById('tw-image').setAttribute('content', d.BASE_URL + '/admin/categorias/' + cat.id + '/foto');
        } else if (d.tieneImagenDefecto) {
          document.getElementById('og-image').setAttribute('content', d.BASE_URL + '/imagen-og-defecto');
          document.getElementById('tw-image').setAttribute('content', d.BASE_URL + '/imagen-og-defecto');
        }

        // Twitter
        if (d.twitterActivo) {
          document.getElementById('tw-title').setAttribute('content', cat.meta_title || cat.nombre);
          if (cat.meta_description) {
            document.getElementById('tw-description').setAttribute('content', cat.meta_description);
          }
        }

        // Hreflang
        var head = document.head;
        d.alternates.forEach(function(alt) {
          var link = document.createElement('link');
          link.rel = 'alternate';
          link.setAttribute('hreflang', alt.lang_code);
          var pfx = alt.lang_code !== 'es' ? '/' + alt.lang_code + '/' : '/';
          var pfxFlota = (d.palabrasPaginas && d.palabrasPaginas.flota) ? d.palabrasPaginas.flota : 'flota';
          link.href = d.BASE_URL + pfx + pfxFlota + '/' + alt.slug_url;
          head.appendChild(link);
        });
        var linkDefault = document.createElement('link');
        linkDefault.rel = 'alternate';
        linkDefault.setAttribute('hreflang', 'x-default');
        linkDefault.href = d.BASE_URL + '/flota/' + cat.slug_url;
        head.appendChild(linkDefault);

        // Schema.org
        var s1 = document.createElement('script');
        s1.type = 'application/ld+json';
        s1.textContent = JSON.stringify(d.schemaVehicle);
        head.appendChild(s1);
        var s2 = document.createElement('script');
        s2.type = 'application/ld+json';
        s2.textContent = JSON.stringify(d.schemaBreadcrumb);
        head.appendChild(s2);

        // ── Cabecera y footer ───────────────────────────────────────────────
        document.getElementById('link-logo').href = base;
        document.getElementById('link-logo').textContent = d.nombreMarca;
        document.getElementById('link-volver-flota').href = base + (pp.flota || 'flota');
        document.getElementById('link-volver-flota').textContent = '← ' + (tx.home_footer_flota || 'Flota');
        document.getElementById('link-contacto').href = base + (pp.contacto || 'contacto');
        document.getElementById('link-contacto').textContent = tx.nav_contacto || 'Contacto';

        document.getElementById('footer-rutas').href    = base + (pp.rutas    || 'rutas');
        document.getElementById('footer-destinos').href = base + (pp.destinos || 'destinos');
        document.getElementById('footer-flota').href    = base + (pp.flota    || 'flota');
        document.getElementById('footer-contacto').href = base + (pp.contacto || 'contacto');
        document.getElementById('footer-acceso-clientes').href = base + (pp['mi-reserva'] || 'mi-reserva');

        if (tx.home_footer_rutas)    document.getElementById('footer-rutas').textContent    = tx.home_footer_rutas;
        if (tx.home_footer_destinos) document.getElementById('footer-destinos').textContent = tx.home_footer_destinos;
        if (tx.home_footer_flota)    document.getElementById('footer-flota').textContent    = tx.home_footer_flota;
        if (tx.home_footer_contacto) document.getElementById('footer-contacto').textContent = tx.home_footer_contacto;
        if (tx.home_footer_acceso_clientes) document.getElementById('footer-acceso-clientes').textContent = tx.home_footer_acceso_clientes;
        if (tx.home_footer_alta_choferes)   document.getElementById('footer-alta-choferes').textContent   = tx.home_footer_alta_choferes;
        if (tx.home_footer_acceso_choferes) document.getElementById('footer-acceso-choferes').textContent = tx.home_footer_acceso_choferes;
        if (d.nombreMarca) document.getElementById('footer-marca').textContent = d.nombreMarca;

        // Alta/acceso choferes: solo en español
        if (lang !== 'es') {
          document.getElementById('footer-alta-choferes').style.display   = 'none';
          document.getElementById('footer-acceso-choferes').style.display = 'none';
        }

        // ── Contenido principal ─────────────────────────────────────────────
        var html = '';

        // Foto de cabecera
        html += '<div class="foto-cabecera">';
        if (cat.tiene_foto) {
          html += '<img src="/admin/categorias/' + cat.id + '/foto" alt="' + esc(cat.nombre) + '">';
        }
        html += '</div>';

        // Título
        html += '<h1 class="titulo-categoria">' + esc(cat.nombre) + '</h1>';

        // Subtítulo (modelos de vehículo)
        if (cat.subtitulo) {
          html += '<p class="subtitulo-categoria">' + esc(cat.subtitulo) + '</p>';
        }

        // Descripción corta
        if (cat.descripcion) {
          html += '<p class="descripcion-categoria">' + esc(cat.descripcion) + '</p>';
        }

        // Capacidad
        html += '<div class="capacidad-bloque">';
        html += '<div class="capacidad-item"><div class="cap-valor">' + esc(String(cat.capacidad_pasajeros)) + '</div><div class="cap-etiqueta">' + esc(tx.tabla_columna_pasajeros || 'Pasajeros') + '</div></div>';
        html += '<div class="capacidad-item"><div class="cap-valor">' + esc(String(cat.capacidad_maletas)) + '</div><div class="cap-etiqueta">' + esc(tx.tabla_columna_equipaje || 'Maletas') + '</div></div>';
        if (cat.limite_sillas && cat.limite_sillas > 0) {
          html += '<div class="capacidad-item"><div class="cap-valor">' + esc(String(cat.limite_sillas)) + '</div><div class="cap-etiqueta">Sillas bebé</div></div>';
        }
        html += '</div>';

        // Características
        if (cat.caracteristicas) {
          var items = cat.caracteristicas.split('\n').filter(function(l) { return l.trim(); });
          if (items.length > 0) {
            html += '<div class="caracteristicas-lista">';
            items.forEach(function(item) {
              html += '<span class="caracteristica-item">' + esc(item.trim()) + '</span>';
            });
            html += '</div>';
          }
        }

        // Botón reservar
        var urlReserva = (lang !== 'es' ? '/' + lang + '/' : '/') + '?categoria=' + cat.id;
        html += '<div class="botones-accion">';
        html += '<a href="' + urlReserva + '" class="boton-reservar">' + esc(tx.boton_solicitar_traslado || 'Solicitar traslado') + '</a>';
        html += '</div>';

        // Descripción larga
        if (cat.descripcion_larga) {
          html += '<div class="seccion"><p class="descripcion-larga">' + esc(cat.descripcion_larga) + '</p></div>';
        }

        // Tabla de precios por ruta
        if (d.precios && d.precios.length > 0) {
          html += '<div class="seccion">';
          html += '<h2>' + esc(tx.titulo_tarifas || 'Tarifas') + '</h2>';
          html += '<table class="tabla-tarifas"><thead><tr>';
          html += '<th>' + esc(tx.tabla_columna_categoria || 'Ruta') + '</th>';
          html += '<th style="text-align:right;">' + esc(tx.tabla_columna_precio || 'Precio') + '</th>';
          html += '</tr></thead><tbody>';
          d.precios.forEach(function(p) {
            html += '<tr>';
            html += '<td>' + esc(p.origen) + ' → ' + esc(p.destino) + '</td>';
            html += '<td style="text-align:right;">';
            if (p.precio) {
              html += '<span class="precio-valor">' + Number(p.precio).toFixed(0) + ' €</span>';
              html += '<span class="badge-fijo">' + esc(tx.badge_precio_fijo || '') + '</span>';
            } else {
              html += '<span class="consultar">' + esc(tx.texto_a_consultar || 'A consultar') + '</span>';
            }
            html += '</td></tr>';
          });
          html += '</tbody></table>';
          html += '<p style="margin-top:20px;"><a href="' + urlReserva + '" class="boton-reservar">' + esc(tx.boton_solicitar_traslado || 'Solicitar traslado') + '</a></p>';
          html += '</div>';
        }

        // Cómo funciona
        html += '<div class="seccion">';
        html += '<h2>' + esc(tx.titulo_como_funciona || '') + '</h2>';
        html += '<div class="tres-columnas">';
        html += '<div class="tarjeta"><strong>' + esc(tx.paso1_titulo || '') + '</strong><p style="margin-top:8px;font-size:14px;color:var(--texto-muted);">' + esc(tx.paso1_texto || '') + '</p></div>';
        html += '<div class="tarjeta"><strong>' + esc(tx.paso2_titulo || '') + '</strong><p style="margin-top:8px;font-size:14px;color:var(--texto-muted);">' + esc(tx.paso2_texto || '') + '</p></div>';
        html += '<div class="tarjeta"><strong>' + esc(tx.paso3_titulo || '') + '</strong><p style="margin-top:8px;font-size:14px;color:var(--texto-muted);">' + esc(tx.paso3_texto || '') + '</p></div>';
        html += '</div></div>';

        document.getElementById('contenido-categoria').innerHTML = html;
      })
      .catch(function() {
        document.getElementById('contenido-categoria').innerHTML =
          '<div class="error-msg">No se pudo cargar la información.</div>';
      });

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
